<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loorek</title>
<meta name="theme-color" content="#0b0b0d">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icon.png">
<style>
:root {
  --bg: #0a0a0b; --card: #151517; --card-2: #1c1c1f; --card-3: #232327;
  --line: rgba(255,255,255,.075); --line-2: rgba(255,255,255,.14);
  --text: #f4f4f5; --sub: #a3a3a8; --dim: #6f6f76;
  --accent: #60cdff; --on-accent: #00232f; --violet: #8f7bff; --ok: #6ccb5f; --warn: #f5c84c; --bad: #ff8f9a;
  --r: 10px; --ease: cubic-bezier(.2,.8,.2,1);
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); overflow: hidden;
  font: 13.5px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  display: grid; grid-template-columns: 212px minmax(0, 1fr); -webkit-user-select: none; user-select: none;
}
body::before {
  content: ""; position: fixed; inset: -30%; z-index: -1; pointer-events: none;
  background: radial-gradient(34% 30% at 30% 8%, rgba(96,205,255,.12), transparent 70%), radial-gradient(30% 28% at 88% 20%, rgba(143,123,255,.11), transparent 70%), radial-gradient(40% 30% at 60% 100%, rgba(30,160,170,.07), transparent 70%);
  animation: drift 26s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate3d(3%, 2%, 0) rotate(4deg) scale(1.06); } }
[hidden] { display: none !important; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { margin: 0; font: 600 22px/1.25 var(--display); letter-spacing: -.1px; }
h2 { margin: 0; font: 600 14px/1.3 var(--display); }
h3 { margin: 0; font: 600 13.5px/1.3 var(--display); }
.sub { color: var(--sub); font-size: 12.5px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::-webkit-scrollbar { width: 11px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); background-clip: content-box; border: 3px solid transparent; }

aside { background: rgba(14,14,16,.72); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 10px 12px; gap: 3px; backdrop-filter: blur(20px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
.brand img { width: 32px; height: 32px; border-radius: 9px; }
.brand strong { font: 600 16.5px/1.2 var(--display); }
.nav { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; appearance: none; border: 0; background: none; color: var(--sub); font: inherit; text-align: left; padding: 9px 11px; border-radius: 7px; cursor: pointer; transition: background .15s, color .15s; }
.nav svg { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.svc { display: inline-flex; width: 18px; height: 18px; flex-shrink: 0; vertical-align: -3px; }
.svc:empty { display: none; }
.svc img { width: 100%; height: 100%; border-radius: 4px; object-fit: contain; display: block; animation: svcIn .35s var(--ease); }
@keyframes svcIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
h1 .svc { width: 24px; height: 24px; margin-right: 10px; vertical-align: -4px; }
h1 .svc img { border-radius: 6px; }
h2 .svc, .row .svc { margin-right: 8px; }
.lbl .svc, .sub .svc { width: 14px; height: 14px; margin-right: 6px; vertical-align: -2.5px; }
.lbl .svc img, .sub .svc img { border-radius: 3px; }
.nav:hover { background: rgba(255,255,255,.045); color: var(--text); }
.nav:focus-visible, .seg button:focus-visible { outline: none; background: rgba(255,255,255,.06); color: var(--text); }
.nav.on { background: rgba(255,255,255,.07); color: var(--text); font-weight: 600; }
.nav::before { content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 16px; margin-top: -8px; border-radius: 3px; background: var(--accent); transform: scaleY(0); transition: transform .3s var(--ease); }
.nav.on::before { transform: scaleY(1); }
.nav b { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--accent); background: rgba(96,205,255,.12); border-radius: 99px; padding: 0 7px; }
.rail-foot { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.who { font-size: 12.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who b { color: var(--text); font-weight: 600; }

.pill { display: inline-flex; align-items: center; align-self: flex-start; font-size: 11.5px; padding: 2px 9px; border-radius: 99px; background: var(--card-2); border: 1px solid var(--line); color: var(--sub); white-space: nowrap; transition: all .3s var(--ease); }
.pill.run { color: var(--accent); border-color: rgba(96,205,255,.45); background: rgba(96,205,255,.1); }
.pill.run::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1.8s ease-out infinite; }
.pill.wait { color: var(--warn); border-color: rgba(245,200,76,.4); background: rgba(245,200,76,.08); }
.pill.ok { color: var(--ok); border-color: rgba(108,203,95,.4); background: rgba(108,203,95,.08); }
.pill.bad { color: var(--bad); border-color: rgba(255,143,154,.4); background: rgba(255,143,154,.08); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(96,205,255,.6); } 100% { box-shadow: 0 0 0 7px rgba(96,205,255,0); } }

main { overflow-y: auto; padding: 22px 26px 26px; }
.tab { display: none; flex-direction: column; gap: 12px; max-width: 1180px; margin: 0 auto; }
.tab.on { display: flex; animation: tabIn .4s var(--ease); }
@keyframes tabIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 4px; }
.head p { margin: 3px 0 0; color: var(--sub); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.btn { appearance: none; font: inherit; white-space: nowrap; color: var(--text); background: var(--card-2); border: 1px solid var(--line-2); border-radius: 7px; padding: 7px 14px; cursor: pointer; transition: background .15s, transform .12s, border-color .15s; }
.btn:hover { background: var(--card-3); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.primary:hover { background: #7ad6ff; }
.btn.ghost { background: none; border-color: var(--line); color: var(--sub); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.icon { appearance: none; background: none; border: 0; color: var(--dim); font: inherit; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; transition: background .15s, color .15s; }
.icon:hover { background: var(--card-3); color: var(--text); }
input[type=text], input[type=number] { width: 100%; font: inherit; color: var(--text); background: #0f0f11; border: 1px solid var(--line-2); border-bottom-color: rgba(255,255,255,.3); border-radius: 7px; padding: 8px 11px; outline: none; transition: border-color .2s, background .2s; -webkit-user-select: text; user-select: text; }
input[type=text]:focus, input[type=number]:focus { border-bottom-color: var(--accent); background: #0c0c0e; box-shadow: 0 1px 0 0 var(--accent); }
input::placeholder { color: var(--dim); }
input[type=number] { width: 70px; text-align: center; }

.sw { appearance: none; width: 40px; height: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,.55); background: transparent; position: relative; cursor: pointer; flex-shrink: 0; transition: background .2s, border-color .2s; margin: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.8); transition: transform .28s var(--ease), width .2s, background .2s; }
.sw:hover::after { transform: scale(1.15); }
.sw:active::after { width: 16px; }
.sw:checked { background: var(--accent); border-color: var(--accent); }
.sw:checked::after { background: var(--on-accent); transform: translateX(20px); }
.sw:checked:active::after { transform: translateX(16px); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; padding-top: 2px; }
.row:last-child { padding-bottom: 2px; }
.row small { display: block; color: var(--sub); font-size: 12px; margin-top: 1px; }
.num { display: flex; align-items: center; gap: 7px; color: var(--sub); font-size: 12px; }

.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.slot { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-height: 104px; overflow: hidden; transition: border-color .4s; }
.slot.live { border-color: rgba(96,205,255,.35); }
.slot.live::before { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(96,205,255,.11), transparent 55%); pointer-events: none; }
.slot .lbl { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.slot .name { font: 600 18px/1.3 var(--display); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .meta { color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot.empty .name { color: var(--dim); font-weight: 400; font-size: 15px; }
.eq { display: flex; gap: 2.5px; align-items: flex-end; height: 14px; flex-shrink: 0; }
.slot .eq { position: absolute; right: 15px; top: 16px; }
.eq i { width: 3px; border-radius: 2px; background: var(--accent); animation: eq 1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.35s; } .eq i:nth-child(3) { animation-delay: -.7s; }
@keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font: 600 22px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--sub); }

.list { display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; transition: border-color .2s, background .2s, transform .25s var(--ease), opacity .2s; }
.item:hover { border-color: var(--line-2); }
.enter { animation: itemIn .42s var(--ease) backwards; }
@keyframes itemIn { from { opacity: 0; transform: translateY(8px) scale(.985); } }
.item.dragging { opacity: .35; }
.item.off { opacity: .55; }
.item[draggable=true] { cursor: grab; }
.txt { flex: 1; min-width: 0; }
.nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #3a3a40; flex-shrink: 0; transition: background .3s; }
.dot.on { background: var(--ok); animation: dotPulse 2.2s ease-out infinite; }
.dot.watch { background: var(--accent); animation: pulse 1.8s ease-out infinite; }
@keyframes dotPulse { 0% { box-shadow: 0 0 0 0 rgba(108,203,95,.55); } 100% { box-shadow: 0 0 0 7px rgba(108,203,95,0); } }
.col { width: 78px; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.col b { font-weight: 600; }
.col span { display: block; font-size: 11.5px; color: var(--sub); }
.col .plus { color: var(--ok); }
.art { width: 30px; height: 40px; border-radius: 5px; background: #26262a center/cover no-repeat; border: 1px solid var(--line); flex-shrink: 0; }
.art.big { width: 54px; height: 72px; border-radius: 7px; }
.pos { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--accent); color: var(--on-accent); flex-shrink: 0; }
.pos.star { background: none; color: var(--warn); font-size: 16px; }
.pos.rank { background: var(--card-3); color: var(--sub); border: 1px solid var(--line-2); }
.empty { color: var(--dim); text-align: center; padding: 18px 8px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.gcard { position: relative; display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 11px; cursor: pointer; transition: border-color .2s, transform .2s var(--ease), background .2s; }
.gcard:hover { border-color: var(--line-2); transform: translateY(-2px); background: var(--card-2); }
.gcard.q { border-color: rgba(96,205,255,.45); background: linear-gradient(100deg, rgba(96,205,255,.1), var(--card) 65%); }
.gcard.done { opacity: .6; }
.qsec { display: flex; align-items: center; gap: 10px; margin: 2px 0 8px; font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.qsec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.quests { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.quests:empty, .qsec[hidden] { display: none; }
.qban { position: relative; display: flex; gap: 14px; align-items: center; padding: 14px 16px 14px 18px; border-radius: 12px; cursor: pointer; overflow: hidden;
  border: 1px solid rgba(143,123,255,.32); background: linear-gradient(100deg, rgba(143,123,255,.2), rgba(96,205,255,.06) 42%, var(--card) 78%); transition: border-color .2s, transform .2s var(--ease), box-shadow .2s; }
.qban::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(180deg, var(--violet), var(--accent)); }
.qban:hover { border-color: rgba(143,123,255,.65); transform: translateY(-2px); box-shadow: 0 10px 28px -14px rgba(143,123,255,.6); }
.qban.q { border-color: rgba(96,205,255,.6); }
.qban.done { opacity: .62; }
.qban .main { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; flex: 1; min-width: 0; }
.qban .who { display: flex; gap: 14px; align-items: center; flex: 0 1 300px; min-width: 0; }
.qban .who .art.big { width: 66px; height: 88px; border-radius: 9px; box-shadow: 0 6px 18px -8px #000; }
.qban .who .nm { font: 650 17px var(--display); letter-spacing: -.01em; white-space: normal; }
.qban .who .pill { margin-bottom: 5px; }
.qban .who .pill:not(.run) { color: #c9bfff; border-color: rgba(143,123,255,.45); background: rgba(143,123,255,.12); }
.qban .rws { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1 1 230px; min-width: 0; }
@media (max-width: 1040px) { .qban .who { flex-basis: 236px; gap: 11px; } .qban .who .art.big { width: 54px; height: 72px; } .qban .who .nm { font-size: 15.5px; } .rwl { max-width: none; padding-left: 0; } }
.rwl { display: flex; flex-wrap: wrap; gap: 8px 7px; max-width: 132px; padding-left: 4px; }
.rw { min-width: 98px; max-width: 150px; padding: 8px 8px 7px; border-radius: 9px; background: rgba(0,0,0,.28); border: 1px solid var(--line); text-align: center; min-width: 0; }
.rw .dimg { width: 44px; height: 44px; margin: 0 auto 6px; }
.rw .rn { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rw .rs { font-size: 11px; color: var(--sub); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rw .bar { margin-top: 5px; height: 4px; }
.rw.done { border-color: rgba(108,203,95,.4); } .rw.done .bar div { background: var(--ok); } .rw.done .rs { color: var(--ok); }
.rw.claim { border-color: rgba(245,200,76,.5); } .rw.claim .rs { color: var(--warn); }
.rw.live { border-color: rgba(96,205,255,.55); } .rw.live .rs { color: var(--accent); }
.rw.daily { min-width: 176px; max-width: 220px; }
.rw .rs.sub { color: var(--dim); margin-top: 2px; }
.pips { display: flex; gap: 4px; justify-content: center; margin: 2px 0 6px; }
.pips:empty { display: none; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.14); }
.pips i.on { background: var(--ok); box-shadow: 0 0 6px rgba(108,203,95,.55); }
.pips i.now { background: var(--accent); box-shadow: 0 0 6px rgba(96,205,255,.6); }
.dcard .pips { justify-content: flex-start; margin: 4px 0 2px; }
.rw.lock { min-width: 0; padding: 0; border: 0; background: none; opacity: .5; position: relative; } .rw.lock .dimg { width: 38px; height: 38px; margin: 0; filter: grayscale(1); }
.rw.lock::after { content: "🔒"; position: absolute; right: -3px; bottom: -4px; font-size: 11px; }
#rpcMore { transition: opacity .2s; } #rpcMore.off { opacity: .45; }
#rpcCard > .row { padding-bottom: 10px; } #rpcMore > .row:first-child { border-top: 1px solid var(--line); padding-top: 10px; }
#rpcNote.ok { color: var(--ok); } #rpcNote.bad { color: var(--warn); }
.icon svg, .ib svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; display: block; }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; margin-right: 6px; }
.gacts { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.gacts .col2 { display: flex; flex-direction: column; gap: 6px; }
.ib { appearance: none; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--sub); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .15s, color .15s, border-color .15s, transform .2s var(--ease); }
.ib:hover { color: var(--text); border-color: var(--accent); background: var(--card-3); }
.ib:active { transform: scale(.92); }
.ib.star.on { color: var(--warn); border-color: rgba(245,200,76,.5); background: rgba(245,200,76,.1); }
.ib.star.on svg { fill: currentColor; }
.ib.add { width: 38px; height: 38px; border-radius: 50%; border-width: 1.5px; color: var(--text); }
.ib.add svg { width: 18px; height: 18px; stroke-width: 2.2; }
.ib.add:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ib.add.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font: 700 15px var(--display); animation: pop .35s var(--ease); }
.lang { position: relative; display: inline-block; text-align: left; }
.lang-btn { appearance: none; display: flex; align-items: center; gap: 8px; font: inherit; color: var(--text); background: #0f0f11; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; cursor: pointer; transition: border-color .15s, background .15s; }
.lang-btn:hover { border-color: var(--accent); }
.lang-btn > svg { width: 12px; height: 12px; fill: none; stroke: var(--sub); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s var(--ease); }
.lang.open .lang-btn > svg { transform: rotate(180deg); }
.flag { width: 21px; height: 15px; border-radius: 3px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.16); display: block; }
.flag svg { width: 100%; height: 100%; display: block; }
.flag.globe { box-shadow: none; display: grid; place-items: center; color: var(--sub); }
.flag.globe svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.lang-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 236px; max-height: 330px; overflow: auto; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 5px; box-shadow: 0 18px 50px rgba(0,0,0,.6); animation: rise .2s var(--ease); }
.lang.up .lang-menu { top: auto; bottom: calc(100% + 6px); }
.lang-item { display: flex; align-items: center; gap: 10px; width: 100%; appearance: none; border: 0; background: none; color: var(--text); font: inherit; text-align: left; padding: 7px 9px; border-radius: 7px; cursor: pointer; }
.lang-item:hover { background: rgba(255,255,255,.07); }
.lang-item.on { background: rgba(96,205,255,.13); color: var(--accent); }
.gate-card { position: relative; }
.gate-lang { position: absolute; top: 12px; right: 12px; }
.gate-lang .lang-btn { background: none; padding: 5px 8px; }
.gate-lang .lang-name { display: none; }
.gcard .pos { animation: pop .35s var(--ease); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.18); } }
.star-mark { color: var(--warn); font-size: 13px; margin-right: 3px; }
.toolbar { display: flex; gap: 8px; align-items: center; }
.toolbar input { max-width: 340px; }

.camp { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.camp:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.camp-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--sub); font-size: 12.5px; margin: 6px 0 10px; }
.facts b { color: var(--text); font-weight: 600; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.dcard { display: flex; gap: 11px; align-items: center; background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0; }
.qitem .dcard { background: var(--card); }
.dcard.done { border-color: rgba(108,203,95,.35); }
.dcard.claim { border-color: rgba(245,200,76,.45); }
.dimg { width: 46px; height: 46px; border-radius: 8px; background: #101012; border: 1px solid var(--line); flex-shrink: 0; overflow: hidden; display: grid; place-items: center; color: var(--dim); font-size: 18px; }
.dimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bar { height: 5px; border-radius: 5px; background: rgba(255,255,255,.09); overflow: hidden; margin-top: 6px; }
.bar div { height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--accent), var(--violet)); transition: width 1s var(--ease); position: relative; overflow: hidden; }
.bar.live div::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: translateX(-100%); animation: shimmer 2.2s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.dcard.done .bar div { background: var(--ok); }
.tag { font-size: 11.5px; color: var(--sub); }
.tag.ok { color: var(--ok); } .tag.warn { color: var(--warn); } .tag.run { color: var(--accent); }
.qitem { flex-direction: column; align-items: stretch; gap: 0; padding: 12px 14px; }
.qitem .top { display: flex; align-items: center; gap: 12px; }
.qitem .top .pill { align-self: center; }
.qitem .body { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: none; }
.qitem.open .body { display: block; animation: fade .25s; }
.qitem .top.fold { cursor: pointer; }
.icon.chev svg { transition: transform .25s var(--ease); }
.qitem.open .icon.chev svg { transform: rotate(180deg); }
.seg { display: inline-flex; align-self: flex-start; gap: 3px; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; }
.seg button { appearance: none; border: 0; background: none; color: var(--sub); font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: background .15s, color .15s; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--card-3); color: var(--text); font-weight: 600; }
.seg b { font-size: 11.5px; font-weight: 600; color: var(--accent); background: rgba(96,205,255,.12); border-radius: 99px; padding: 0 7px; }
.pane { display: none; flex-direction: column; gap: 12px; }
.pane.on { display: flex; animation: tabIn .3s var(--ease); }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pane-head p { margin: 0; color: var(--sub); }
.avw { position: relative; flex-shrink: 0; display: grid; }
.ava { width: 34px; height: 34px; border-radius: 50%; background: var(--card-3); border: 1px solid var(--line-2); overflow: hidden; display: grid; place-items: center; font: 600 13px var(--display); color: var(--sub); text-transform: uppercase; flex-shrink: 0; }
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avw .dot { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border: 2px solid var(--card-2); }
.ac { position: relative; flex: 1; min-width: 0; }
.ac-menu { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 25; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 5px; box-shadow: 0 18px 50px rgba(0,0,0,.6); max-height: 340px; overflow: auto; animation: rise .2s var(--ease); }
.ac-item { display: flex; align-items: center; gap: 10px; width: 100%; appearance: none; border: 0; background: none; color: var(--text); font: inherit; text-align: left; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
.ac-item:hover, .ac-item.sel { background: rgba(255,255,255,.07); }
.ac-item.has { opacity: .55; }
.ac-note { color: var(--dim); padding: 10px; text-align: center; }
.farm { position: relative; overflow: hidden; background: linear-gradient(120deg, rgba(96,205,255,.13), rgba(143,123,255,.07) 60%, transparent), var(--card); border-color: rgba(96,205,255,.35); }
.farm .top { display: flex; gap: 14px; align-items: center; }
.farm .big { font: 600 18px/1.3 var(--display); }
.farm .bar { height: 7px; margin-top: 12px; }
.barinfo { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--sub); margin-top: 6px; font-variant-numeric: tabular-nums; }

#shade { position: fixed; inset: 0; z-index: 14; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .3s; }
#shade.on { opacity: 1; pointer-events: auto; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 15; width: min(520px, 92vw); background: #121214; border-left: 1px solid var(--line-2); box-shadow: -30px 0 80px rgba(0,0,0,.55); transform: translateX(104%); transition: transform .42s var(--ease); display: flex; flex-direction: column; }
#drawer.on { transform: none; }
.dr-head { display: flex; gap: 14px; align-items: center; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
.dr-body { flex: 1; overflow-y: auto; padding: 16px 18px 20px; }
.dr-foot { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.dr-foot .btn { flex: 1; }
#drawer .dgrid { grid-template-columns: 1fr; }

.log { font: 12px/1.55 "Cascadia Mono", Consolas, monospace; -webkit-user-select: text; user-select: text; overflow-y: auto; }
.log div { padding: 1px 0; color: var(--sub); white-space: pre-wrap; word-break: break-word; }
.log div.ok { color: var(--ok); } .log div.warn { color: var(--warn); } .log div.err { color: var(--bad); }
.log time { color: var(--dim); margin-right: 8px; }
#log { height: calc(100vh - 190px); min-height: 200px; }

#gate { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 26px; background: rgba(10,10,11,.72); backdrop-filter: blur(18px); animation: fade .3s; }
@keyframes fade { from { opacity: 0; } }
.gate-card { width: 100%; max-width: 440px; text-align: center; background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 30px 26px 24px; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: rise .5s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.97); } }
.gate-card > img { width: 68px; height: 68px; border-radius: 17px; animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
.gate-card h1 { font-size: 20px; margin: 16px 0 6px; }
.gate-card p { color: var(--sub); margin: 0 0 18px; }
.gate-card .btn { width: 100%; padding: 10px; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,.12); border-top-color: var(--accent); margin: 4px auto 14px; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.note { color: var(--warn); font-size: 12.5px; margin-top: 12px; }
details.alt { margin-top: 14px; text-align: left; border-top: 1px solid var(--line); padding-top: 10px; }
details.alt summary { cursor: pointer; color: var(--sub); font-size: 12.5px; list-style: none; user-select: none; }
details.alt summary::-webkit-details-marker { display: none; }
details.alt summary::before { content: "›"; display: inline-block; margin-right: 7px; transition: transform .2s var(--ease); }
details.alt[open] summary::before { transform: rotate(90deg); }
details.alt summary:hover { color: var(--text); }
details.alt > div { padding-top: 10px; animation: svcIn .25s var(--ease); }
.waitrow { display: flex; align-items: center; gap: 12px; margin: 14px 0 4px; color: var(--sub); text-align: left; }
.waitrow .spin { margin: 0; flex-shrink: 0; width: 22px; height: 22px; }
select { font: inherit; color: var(--text); background: #0f0f11; border: 1px solid var(--line-2); border-radius: 7px; padding: 7px 10px; outline: none; max-width: 240px; }
select:focus { border-color: var(--accent); }
.steps { text-align: left; margin: 4px 0 14px; padding-left: 20px; color: var(--sub); }
.steps li { margin: 6px 0; }
.steps code { color: var(--text); background: #0f0f11; padding: 1px 5px; border-radius: 4px; font: 12px Consolas, monospace; }
.kbd, kbd { display: inline-block; font: 11.5px "Segoe UI", sans-serif; color: var(--text); background: var(--card-3); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; }

#toast { position: fixed; left: 50%; bottom: 20px; z-index: 30; transform: translate(-50%, 30px); opacity: 0; background: var(--card-3); border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 15px; box-shadow: 0 12px 34px rgba(0,0,0,.5); transition: transform .35s var(--ease), opacity .25s; pointer-events: none; max-width: 90%; }
#toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (max-width: 900px) {
  body { grid-template-columns: 58px minmax(0, 1fr); }
  .brand strong, .nav span, .nav b, .who { display: none; }
  .brand { padding: 2px 3px 14px; } .nav { justify-content: center; padding: 10px 0; } .rail-foot { align-items: center; padding: 10px 0 0; }
  .rail-foot .pill { font-size: 0; padding: 5px; } .rail-foot .pill.run::before { margin: 0; }
  .cols { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } main { padding: 16px 14px 20px; }
  .col.wide { display: none; }
}
@media (max-width: 560px) { .slots { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>

const shown = {};
function countTo(node, key, value) {
  const from = shown[key] == null ? value : shown[key];
  shown[key] = value;
  if (from === value) { node.textContent = fmt(value); return; }
  const t0 = performance.now(), dur = 700;
  const step = (t) => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); node.textContent = fmt(Math.round(from + (value - from) * e)); if (k < 1 && node.isConnected) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function changed(name, data) { const s = JSON.stringify(data); if (sigs[name] === s) return false; sigs[name] = s; return true; }

const mins = (m) => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60); return h ? tr('dur.hm', { h, m: m % 60 }) : tr('dur.m', { m }); };

// suggestions while typing: kind is twitch | kick | game; pick(item) is called with the chosen one
function suggest(input, kind, pick, has) {
  const wrap = el('div', 'ac'); input.parentNode.insertBefore(wrap, input); wrap.append(input);
  const menu = el('div', 'ac-menu'); menu.hidden = true; wrap.append(menu);

    menu.textContent = ''; menu.hidden = false;
    if (note) { menu.append(el('div', 'ac-note', note)); return; }

      const on = has(it), b = el('button', 'ac-item' + (on ? ' has' : '')); b.type = 'button';
      const t = el('div', 'txt'); t.append(el('div', 'nm', it.name));

      const line = sub.filter(Boolean).join(' · '); if (line) t.append(el('div', 'sb', line));
      b.append(kind === 'game' ? art(it.art) : avatar(it.img, it.name), t); if (it.live) b.append(el('span', 'pill run', tr('ac.live')));

}

function sortable(list, onDone) {
  let drag = null;

  });

const STC = { ready: '', claim: 'wait', done: 'ok', today: 'ok', nolink: 'bad', nocamp: '', upcoming: '', blocked: '' };

// one reward: picture, what it is, how much watching it needs, where it stands

const soonT = (ms) => (ms - Date.now() < 86400000 ? new Date(ms).toLocaleTimeString(LOC, { hour: '2-digit', minute: '2-digit' }) : when(ms));

// a daily reward: one dot per day - collected, today's (running), still ahead
function pips(d) {

  return [Math.floor(Math.min(d.cur, d.req)) + ' / ' + tr('dur.m', { m: d.req }) + ' · ' + day, d.until ? tr('drop.until', { when: soonT(d.until) }) : d.days ? tr('drop.daysGot', { a: d.done, b: d.days }) : tr('drop.daysGotN', { a: d.done })];
}
function dropCard(d, live) {

  const c = el('div', 'dcard' + (done ? ' done' : claim ? ' claim' : ''));
  const im = el('div', 'dimg'); if (d.img) { const i = el('img'); i.src = d.img; i.alt = ''; i.draggable = false; i.onerror = () => { i.remove(); im.textContent = '🎁'; }; im.append(i); } else im.textContent = '🎁';
  const t = el('div', 'txt'); t.append(el('div', 'nm', (d.name || tr('drop.noname')) + (d.day && !isDaily(d) ? ' · ' + tr('drop.day', { n: d.day }) : '')));
  if (isDaily(d)) { // a daily reward: the days, today's state, the next round
    const [a, b] = dailyText(d); t.append(pips(d), el('div', 'sb', a), el('div', 'sb', b));
    const bar = el('div', 'bar' + (live ? ' live' : '')), fill = el('div'); fill.style.width = (d.claimed ? 100 : d.req ? Math.min(100, d.cur / d.req * 100) : 0) + '%'; bar.append(fill); t.append(bar);

  }

    const top = el('div', 'top');
    const txt = el('div', 'txt'); txt.append(el('div', 'nm', g.name));
    const total = g.camps.reduce((n, c) => n + (c.active ? c.left : 0), 0);
    const active = g.camps.filter((c) => c.active);
    const all = active.reduce((n, c) => n + c.drops.length, 0), got = active.reduce((n, c) => n + c.drops.filter((d) => d.claimed).length, 0);
    const line = g.farming ? tr('q.watching', { ch: g.channel }) : g.status === 'nocamp' ? tr('q.waitCamp') : g.status === 'ready' ? tr('q.left', { t: mins(total) }) : g.status === 'today' && g.next ? tr('q.next', { when: soonT(g.next) }) : g.end ? tr('camps.until', { when: when(g.end) }) : '';
    txt.append(el('div', 'sb', [line, all ? tr('q.rewards', { a: got, b: all }) : ''].filter(Boolean).join(' · ')));
    let [label, cls] = stOf(g.status);
    if (g.farming) { label = tr('stt.watching'); cls = 'run'; } else if (g.status === 'ready' && g.note === 'nostreams') { label = tr('stt.nostreams'); cls = 'wait'; } else if (g.status === 'ready' && g.note === 'stuck') { label = tr('stt.stuck'); cls = 'wait'; } else if (g.status === 'ready' && !s.settings.dropsOn) { label = tr('stt.off'); }
    const pill = el(g.status === 'nolink' && g.link ? 'a' : 'span', 'pill ' + cls, label);
    if (g.status === 'nolink' && g.link) { pill.href = g.link; pill.target = '_blank'; pill.title = tr('q.linkTip'); }
    const del = iconBtn('icon', 'x', tracked ? tr('q.untrack') : tr('q.remove'));
    const ref = { id: g.id, slug: g.slug, name: g.name, art: g.art };
    del.onclick = () => op({ op: tracked ? 'trackToggle' : 'queueToggle', game: ref });
    top.append(tracked ? el('span', 'pos star', '★') : el('span', 'pos', i + 1), art(g.art), txt, pill);
    it.append(top);
    if (active.length) { // campaigns and rewards stay folded until the row is clicked
      const body = el('div', 'body'); const liveDrop = g.farming ? liveDropOf(active, cur) : '';
      for (const c of active) body.append(campBlock(c, liveDrop));
      it.append(body);
      const key = (tracked ? 't:' : 'q:') + g.id, chev = iconBtn('icon chev', 'chev', tr('q.details'));
      const flip = () => { if (unfolded.has(key)) unfolded.delete(key); else unfolded.add(key); it.classList.toggle('open', unfolded.has(key)); };
      it.classList.toggle('open', unfolded.has(key)); top.classList.add('fold');
      top.onclick = (ev) => { if (!ev.target.closest('a, .icon:not(.chev)')) flip(); };
      top.append(chev);
    }
    top.append(del);
    if (!tracked) it.draggable = true;
    return it;
  };
  if (!dragging && changed('queue', [s.drops.queue, s.settings.dropsOn, cur && cur.drop])) {
    const list = $('queueList'); list.textContent = '';
    if (!s.drops.queue.length) list.append(el('div', 'empty', tr('q.empty')));
    s.drops.queue.forEach((g, i) => list.append(qitem(g, i, seen.queue, false)));
  }
  if (changed('track', s.drops.tracked)) {
    const list = $('trackList'); list.textContent = '';
    if (!s.drops.tracked.length) list.append(el('div', 'empty', tr('track.empty')));
    s.drops.tracked.forEach((g, i) => list.append(qitem(g, i, seen.track, true)));
  }

  if (changed('log', s.log.length ? s.log[s.log.length - 1].t + ':' + s.log.length : 0)) {
    logLines($('log'), s.log, tr('log.empty'));
    logLines($('logShort'), s.log.slice(-7), tr('log.nothing'));
  }
  renderDetail();
}

// The app restarts itself after an update, so a short break is normal; a longer one gets a hint what to do.
async function load() {
  try { S = await api('/api/state'); if (fails >= 3) $('toast').classList.remove('show'); fails = 0; render(); }
  catch (e) { fails++; $('pill').className = 'pill bad'; $('pill').textContent = T['pill.noconn'] || '…'; if (fails >= 3 && T['noconn.hint']) toast(T['noconn.hint'], 3600000); }
}
setInterval(() => { if (!document.hidden && !pending) { load(); if (detailId) loadDetail(); } }, 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();

document.querySelectorAll('[data-set]').forEach((inp) => { inp.onchange = () => op({ op: 'settings', patch: { [inp.dataset.set]: inp.type === 'checkbox' ? inp.checked : Number(inp.value) } }); });
$('addForm').onsubmit = async (ev) => { ev.preventDefault(); const v = $('addInput').value.trim(); if (!v) return; const r = await op({ op: 'addChannel', login: v }); if (!r) return; if (r.result === 'ok') { $('addInput').value = ''; toast(tr('toast.added')); } else toast(tr(r.result === 'dup' ? 'toast.dup' : 'toast.badName')); };
$('kickAddForm').onsubmit = async (ev) => { ev.preventDefault(); const v = $('kickAddInput').value.trim(); if (!v) return; const r = await op({ op: 'kickAdd', login: v }); if (!r) return; if (r.result === 'ok') { $('kickAddInput').value = ''; toast(tr('toast.added')); } else toast(tr(r.result === 'dup' ? 'toast.dup' : 'toast.badName')); };
$('kickTokenForm').onsubmit = async (ev) => { ev.preventDefault(); const v = $('kickTokenInput').value.trim(); if (!v) return; const r = await op({ op: 'kickToken', login: v }); if (r && r.result === 'bad') toast(tr('toast.badKickKey')); else { $('kickTokenInput').value = ''; toast(tr('toast.checkingKey')); } };
const addPicked = (addOp) => async (it) => { const r = await op({ op: addOp, login: it.login, name: it.name, img: it.img }); if (r) toast(tr(r.result === 'ok' ? 'toast.added' : r.result === 'dup' ? 'toast.dup' : 'toast.badName')); };
suggest($('addInput'), 'twitch', addPicked('addChannel'), (it) => !!S && S.points.channels.some((c) => c.login === it.login));
suggest($('kickAddInput'), 'kick', addPicked('kickAdd'), (it) => !!S && S.kick.channels.some((c) => c.login === it.login));
const isTracked = (it) => !!S && S.drops.tracked.some((g) => g.id === it.id);
suggest($('trackInput'), 'game', async (it) => { if (isTracked(it)) { toast(tr('ac.tracked')); return; } const r = await op({ op: 'trackToggle', game: { id: it.id, slug: it.slug, name: it.name, art: it.art } }); if (r) toast(tr('toast.tracked', { name: it.name })); }, isTracked);
$('kickLogout').onclick = () => op({ op: 'kickLogout' });
$('campSearch').oninput = () => render();
$('refresh').onclick = () => { op({ op: 'refresh' }); toast(tr('toast.refreshing')); };
$('loginBtn').onclick = () => op({ op: 'login' });
$('loginManual').onclick = () => op({ op: 'loginManual' });
$('toManual').onclick = () => op({ op: 'loginManual' });
$('cancelAuto').onclick = () => op({ op: 'cancelLogin' });
$('cancelLogin').onclick = () => op({ op: 'cancelLogin' });
$('reopen').onclick = () => op({ op: 'loginManual' });
$('kickLoginBtn').onclick = () => op({ op: 'kickLogin' });
$('kickLoginCancel').onclick = () => op({ op: 'kickLoginCancel' });
$('tokenForm').onsubmit = async (ev) => { ev.preventDefault(); const v = $('tokenInput').value.trim(); if (!v) return; const r = await op({ op: 'token', login: v }); if (r && r.result === 'bad') toast(tr('toast.noToken')); else $('tokenInput').value = ''; };
$('logout').onclick = () => op({ op: 'logout' });
mountLang($('langSet'));
mountLang($('langGate'));
$('updCheck').onclick = () => { op({ op: 'updateCheck' }); };
$('updInstall').onclick = () => op({ op: 'updateInstall' });
$('clearLog').onclick = () => op({ op: 'clearLog' });
$('quit').onclick = async () => { await op({ op: 'quit' }); window.close(); };
document.addEventListener('contextmenu', (ev) => { if (!ev.target.closest('.gcard, .qban, input, .log')) ev.preventDefault(); });
</script>
